    const players = [{"number":1,"name":"Liam Bortel","year":"Senior"},{"number":2,"name":"Jack Carlo","year":"Senior"},{"number":3,"name":"Luke Valenti","year":"Senior"},{"number":4,"name":"Bruce Hopkins","year":"Junior"},{"number":5,"name":"Michael O'Rourke","year":"Senior"},{"number":6,"name":"Luca Singh","year":"Senior"},{"number":7,"name":"Elias Alvarez","year":"Senior"},{"number":9,"name":"Jimmy Benedict","year":"Senior"},{"number":10,"name":"Winn Hapgood","year":"Junior"},{"number":11,"name":"Chaston Palen","year":"Senior"},{"number":12,"name":"Luciano Terrero","year":"Senior"},{"number":13,"name":"Henry Stuart","year":"Junior"},{"number":14,"name":"Vini Miranda","year":"Junior"},{"number":15,"name":"Gannon Collins","year":"Senior"},{"number":16,"name":"Hugh Dunlap","year":"Senior"},{"number":17,"name":"Jason Kirby","year":"Senior"},{"number":18,"name":"Aiden Ramos","year":"Senior"},{"number":19,"name":"Nicholas Rachinsky","year":"Junior"},{"number":20,"name":"Charlie Leff","year":"Junior"},{"number":21,"name":"Peter Blake","year":"Junior"},{"number":22,"name":"Jack Mitchell","year":"Junior"},{"number":23,"name":"Henry Emel","year":"Junior"},{"number":24,"name":"Rhodes Van Duyne","year":"Senior"},{"number":25,"name":"Baker Smith","year":"Junior"},{"number":26,"name":"Billy Eising","year":"Sophomore"},{"number":27,"name":"Cooper George","year":"Junior"},{"number":28,"name":"Connor Palomo","year":"Junior"},{"number":29,"name":"Aiden Clifford","year":"Sophomore"},{"number":30,"name":"Chase Kelly","year":"Sophomore"},{"number":31,"name":"John Altoe","year":"Sophomore"},{"number":32,"name":"Kellan Harwick","year":"Sophomore"},{"number":33,"name":"Connor Davenport","year":"Sophomore"},{"number":34,"name":"Sean Mihopoulos","year":"Junior"},{"number":35,"name":"Brody Balderach","year":"Sophomore"},{"number":36,"name":"Jack Mullane","year":"Sophomore"},{"number":37,"name":"John Davey","year":"Junior"},{"number":38,"name":"Tanner Hennemuth","year":"Junior"},{"number":39,"name":"Geordie duPont","year":"Sophomore"},{"number":40,"name":"Jack Ezbiansky","year":"Sophomore"},{"number":41,"name":"Monti Piasecki","year":"Sophomore"},{"number":42,"name":"Danny Cavoli","year":"Junior"},{"number":43,"name":"Troy Carper","year":"Sophomore"},{"number":44,"name":"Logan Ingulli","year":"Senior"},{"number":45,"name":"Kirk Zarghami","year":"Junior"},{"number":46,"name":"Jude McBride","year":"Sophomore"},{"number":48,"name":"Charlie McIntosh","year":"Sophomore"},{"number":49,"name":"Teddy Monahan","year":"Sophomore"},{"number":50,"name":"Hunter Spalsbury","year":"Senior"},{"number":51,"name":"Drew Agarabi","year":"Sophomore"},{"number":52,"name":"Will Giesen","year":"Sophomore"},{"number":54,"name":"Bowen Schroeder","year":"Sophomore"},{"number":55,"name":"Killian Ryan","year":"Sophomore"},{"number":56,"name":"Sean Smith","year":"Junior"},{"number":58,"name":"Joe Roche","year":"Junior"},{"number":60,"name":"Klevis Buqani","year":"Sophomore"},{"number":66,"name":"Michael Taylor","year":"Senior"},{"number":67,"name":"Jack Benedict","year":"Sophomore"},{"number":68,"name":"Max Eills","year":"Sophomore"},{"number":74,"name":"Tanner McWilliams","year":"Sophomore"},{"number":75,"name":"Thomas Cavolo","year":"Senior"},{"number":77,"name":"James Dionisio","year":"Senior"},{"number":78,"name":"Will Primmer","year":"Senior"},{"number":80,"name":"Brooks Bortel","year":"Sophomore"},{"number":81,"name":"Johnny Dunlap","year":"Sophomore"},{"number":82,"name":"Callum McBride","year":"Sophomore"},{"number":83,"name":"Brett Buys","year":"Junior"},{"number":84,"name":"Jameson Murphy","year":"Sophomore"},{"number":85,"name":"Ryan Kim","year":"Sophomore"},{"number":88,"name":"Ben Cohen","year":"Sophomore"},{"number":89,"name":"Patrick Kelly","year":"Senior"},{"number":90,"name":"Blake Wilson","year":"Junior"},{"number":91,"name":"Bo Benedict","year":"Junior"},{"number":95,"name":"Thomas Fogarty","year":"Junior"},{"number":97,"name":"Evan Ust","year":"Senior"},{"number":98,"name":"William Stramandinoli","year":"Junior"},{"number":99,"name":"Jack Turowski","year":"Sophomore"}];
    
    // Build lookup map for O(1)
    const rosterMap = new Map();
    players.forEach(p => rosterMap.set(p.number, p));

    const input = document.getElementById('jersey-input');
    const resultArea = document.getElementById('result-area');
    const resultCard = document.getElementById('result-card');
    const notFound = document.getElementById('not-found');
    const hint = document.getElementById('hint');
    const nameDisplay = document.getElementById('player-name');
    const yearDisplay = document.getElementById('year-display');
    const yearContainer = document.getElementById('year-container');
    const notfoundNum = document.getElementById('notfound-num');

    const modeNumberBtn = document.getElementById('mode-number');
    const modeNameBtn = document.getElementById('mode-name');
    const nameResults = document.getElementById('name-results');
    let currentMode = 'number';

    let debounceTimer = null;

    function clearResults() {
      resultArea.classList.add('hidden');
      notFound.classList.add('hidden');
      hint.classList.remove('hidden');
      yearContainer.className = 'w-full flex items-center justify-center px-6 py-4 rounded-2xl';
    }

    function showPlayer(player) {
      hint.classList.add('hidden');
      notFound.classList.add('hidden');
      resultArea.classList.remove('hidden');

      nameDisplay.textContent = player.name;

      // Style by year
      yearDisplay.textContent = player.year;

      let containerClasses = 'w-full flex items-center justify-center px-6 py-4 rounded-2xl ';
      let textColor = '';

      if (player.year === 'Senior') {
        containerClasses += 'bg-emerald-100';
        textColor = 'text-emerald-700';
      } else if (player.year === 'Junior') {
        containerClasses += 'bg-sky-100';
        textColor = 'text-sky-700';
      } else if (player.year === 'Sophomore') {
        containerClasses += 'bg-amber-100';
        textColor = 'text-amber-700';
      }
      
      yearContainer.className = containerClasses;
      yearDisplay.className = `class-year font-extrabold tracking-tighter ${textColor}`;
    }

    function showNotFound(num) {
      hint.classList.add('hidden');
      resultArea.classList.add('hidden');
      notFound.classList.remove('hidden');
      notfoundNum.textContent = num;
    }

    function lookup(numStr) {
      if (!numStr) {
        clearResults();
        return;
      }

      const num = parseInt(numStr, 10);
      if (isNaN(num) || num < 1 || num > 99) {
        clearResults();
        return;
      }

      const player = rosterMap.get(num);
      if (player) {
        showPlayer(player);
      } else {
        showNotFound(num);
      }
    }


    function setMode(mode) {
      currentMode = mode;
      const label = document.querySelector('label[for="jersey-input"]');
      const hintEl = document.getElementById('hint');
      const hintP = hintEl ? hintEl.querySelector('p') : null;

      if (mode === 'number') {
        modeNumberBtn.classList.add('bg-white', 'shadow-sm');
        modeNumberBtn.classList.remove('text-slate-600');
        modeNameBtn.classList.remove('bg-white', 'shadow-sm');
        modeNameBtn.classList.add('text-slate-600');

        input.type = 'number';
        input.inputMode = 'numeric';
        input.placeholder = '55';
        if (label) label.textContent = 'JERSEY NUMBER';

        if (hintP) hintP.textContent = 'Type a number above • 76 players total';
        nameResults.classList.add('hidden');
        nameResults.innerHTML = '';
      } else {
        modeNameBtn.classList.add('bg-white', 'shadow-sm');
        modeNameBtn.classList.remove('text-slate-600');
        modeNumberBtn.classList.remove('bg-white', 'shadow-sm');
        modeNumberBtn.classList.add('text-slate-600');

        input.type = 'text';
        input.inputMode = 'text';
        input.placeholder = 'name';
        if (label) label.textContent = 'PLAYER NAME';

        if (hintP) hintP.textContent = 'type';
        clearResults();
      }
      input.value = '';
      input.focus();
    }

    modeNumberBtn.addEventListener('click', () => setMode('number'));
    modeNameBtn.addEventListener('click', () => setMode('name'));

    function renderNameResults(matches) {
      nameResults.innerHTML = '';
      if (!matches || matches.length === 0) {
        const div = document.createElement('div');
        div.className = 'p-4 text-slate-500 text-center text-lg';
        div.textContent = 'No matches found';
        nameResults.appendChild(div);
        nameResults.classList.remove('hidden');
        return;
      }
      matches.slice(0, 10).forEach(player => {
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center p-3 mb-1 last:mb-0 border border-transparent hover:border-slate-200 active:bg-slate-50 rounded-2xl cursor-pointer';
        const yearColor = player.year === 'Senior' ? 'text-emerald-600' : player.year === 'Junior' ? 'text-sky-600' : 'text-amber-600';
        const gradeAbbr = { 'Senior': 'Sr', 'Junior': 'Jr', 'Sophomore': 'So' }[player.year] || player.year;
        item.innerHTML = `
          <div>
            <div class="flex items-baseline gap-1">
              <span class="font-mono text-3xl font-bold text-slate-800">${player.number}</span>
              <span class="text-3xl font-semibold text-slate-400 mx-0.5">—</span>
              <span class="text-3xl font-semibold">${player.name}</span>
            </div>
          </div>
          <div class="text-right">
            <span class="text-xl font-bold ${yearColor}">${gradeAbbr}</span>
          </div>
        `;
        item.addEventListener('click', () => {
          showPlayer(player);
          nameResults.classList.add('hidden');
        });
        nameResults.appendChild(item);
      });
      nameResults.classList.remove('hidden');
    }

    function searchByName(query) {
      if (!query || query.length < 1) {
        nameResults.classList.add('hidden');
        nameResults.innerHTML = '';
        return;
      }
      const q = query.toLowerCase().trim();
      const matches = players.filter(p => p.name.toLowerCase().includes(q));
      renderNameResults(matches);
    }

    // Live search with debounce
    input.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const val = input.value.trim();
        if (currentMode === 'number') {
          lookup(val);
        } else {
          searchByName(val);
        }
      }, 130);
    });

    // Enter key
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        clearTimeout(debounceTimer);
        const val = input.value.trim();
        if (currentMode === 'number') {
          lookup(val);
        } else {
          // For name, perhaps select first if any
          const first = nameResults.querySelector('div');
          if (first) first.click();
        }
      }
    });

    // Clear button
    document.getElementById('clear-btn').addEventListener('click', () => {
      input.value = '';
      clearResults();
      nameResults.classList.add('hidden');
      nameResults.innerHTML = '';
      input.focus();
    });

    // Keyboard support: focus input when any key
    document.addEventListener('keydown', (e) => {
      if (document.activeElement !== input && /^[0-9]$/.test(e.key)) {
        input.focus();
      }
    });


    // Initialize default mode
    setMode('number');

    // Keyboard support: focus input when digit typed (number mode hint)
    document.addEventListener('keydown', (e) => {
      if (document.activeElement !== input && currentMode === 'number' && /^[0-9]$/.test(e.key)) {
        input.focus();
      }
    });

    // Initialize
    initTailwind();
    
    // Auto-focus the input on load
    setTimeout(() => {
      input.focus();
    }, 300);

    console.log('%c[2026 Roster Lookup] Mobile-optimized web app ready. Number + Name lookup.', 'color:#64748b');
  </script>
</body>
</html>
