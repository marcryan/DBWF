<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lanyard — Moved</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 90px auto;
           line-height: 1.7; background: #fff; color: #111; }
    a { color: #1144EB; font-weight: 600; }
  </style>
</head>
<body>
  <h1>This project has moved</h1>
  <p>You can now find it at
     <a href="https://marcryan.github.io/lanyard">marcryan.github.io/lanyard</a>.
     Please update your links.</p>
  <p>Redirecting in <span id="count">5</span>&hellip;</p>
  <script>
    var s = 5;
    window.setInterval(function () {
      s -= 1;
      document.getElementById("count").textContent = s;
      if (s <= 0) window.location.replace("https://marcryan.github.io/lanyard");
    }, 1000);
  </script>
</body>
</html>
